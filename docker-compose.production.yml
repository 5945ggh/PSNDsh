services:
  personal-dashboard:
    image: ${IMAGE:?set IMAGE to the published container image}
    init: true
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: file:/app/data/personal-dashboard.db
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET before starting}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-first-user}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN before starting}
    volumes:
      - personal-dashboard-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/capabilities').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  personal-dashboard-data:
    name: personal-dashboard-data
