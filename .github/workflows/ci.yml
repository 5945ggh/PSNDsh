name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./data/ci.db
      AUTH_SECRET: ci-only-secret
      APP_TIMEZONE: Asia/Shanghai
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit and integration tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          no-cache: true
          load: true
          push: false
          tags: personal-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify production runtime and native dependencies
        run: |
          docker run --rm --entrypoint node personal-dashboard:ci -e '
            const assert = require("node:assert/strict");
            const { createRequire } = require("node:module");
            const nextRequire = createRequire(require.resolve("next/package.json"));
            const nextVersion = require("next/package.json").version;
            const sharp = nextRequire("sharp");
            const sharpVersion = sharp.versions.sharp;
            const [major, minor, patch] = sharpVersion.split(".").map(Number);
            assert.equal(process.version, "v22.23.4");
            assert.equal(nextVersion, "16.4.2");
            assert(major > 0 || minor > 35 || (minor === 35 && patch >= 5), `Unexpected sharp ${sharpVersion}`);
            assert(sharp.versions.vips, "sharp native libvips failed to load");
            const Database = require("better-sqlite3");
            const db = new Database(":memory:");
            db.exec("CREATE TABLE smoke (value INTEGER NOT NULL)");
            db.prepare("INSERT INTO smoke (value) VALUES (?)").run(22);
            assert.equal(db.prepare("SELECT value FROM smoke").get().value, 22);
            assert.equal(db.pragma("integrity_check", { simple: true }), "ok");
            db.close();
            console.log(JSON.stringify({ node: process.version, next: nextVersion, sharp: sharpVersion, libvips: sharp.versions.vips, sqlite: "ok" }));
          '
